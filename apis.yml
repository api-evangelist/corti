aid: corti
name: Corti
description: >-
  Corti is a healthcare AI platform for developers, offering a full stack of
  clinical AI building blocks over a single OAuth 2.0-secured API: real-time
  speech-to-text (dictation and ambient documentation over WebSocket), clinical
  text generation and structured/guided documents, AI-assisted medical coding
  (ICD-10, CPT, OPCS-4, CCAM, OPS and more), fact extraction, an Agentic
  Framework (A2A protocol with prebuilt medical experts and MCP integration),
  OpenAI/Anthropic-compatible EU-hosted Corti Models, and an embeddable Corti
  Assistant clinical scribe. The platform is EU/US data-resident and carries
  extensive healthcare compliance (SOC 2, ISO 27001/13485/42001, HIPAA, GDPR,
  EU AI Act, FedRAMP, NHS DTAC/DCB0129). Backed by Atomico and Prosus Ventures.
