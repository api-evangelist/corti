- {from: Fact, type: belongs_to, to: Interaction, via: interactionId}
- {from: Interaction, type: has_many, to: Recording, via: recordings}
- {from: Interaction, type: has_many, to: Transcript, via: transcripts}
- {from: Interaction, type: has_many, to: Document, via: documents}
